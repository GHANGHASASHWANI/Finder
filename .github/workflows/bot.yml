name: Finder bot

# Answers job links you send to your Telegram bot with a tailored resume + referral messages.
on:
  schedule:
    - cron: "*/10 * * * *"     # GitHub may delay this by a few minutes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finder-bot
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Any new messages?
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --check >> "$GITHUB_OUTPUT"

      - name: Cache headless browser
        if: steps.check.outputs.has_work == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.47.0

      - name: Install
        if: steps.check.outputs.has_work == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Decrypt resume and company list
        if: steps.check.outputs.has_work == 'true'
        env:
          FINDER_KEY: ${{ secrets.FINDER_KEY }}
        run: python secure.py unlock

      - name: Answer
        if: steps.check.outputs.has_work == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python bot.py
