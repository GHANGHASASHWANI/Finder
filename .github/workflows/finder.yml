name: Finder

on:
  schedule:
    - cron: "7 */4 * * *"      # every 4 hours (private repo: ~1,400 of 2,000 free minutes/month)
  workflow_dispatch:
    inputs:
      mode:
        description: "Extra flags: --all, --validate, --no-notify, --recheck"
        required: false
        default: ""

permissions:
  contents: write
  models: read        # free AI review via GitHub Models

concurrency:
  group: finder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache headless browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.47.0

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Decrypt private files
        env:
          FINDER_KEY: ${{ secrets.FINDER_KEY }}
        run: python secure.py unlock

      - name: Check career pages
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python finder.py ${{ github.event.inputs.mode || '--all' }}

      - name: Encrypt and save state + dashboard
        env:
          FINDER_KEY: ${{ secrets.FINDER_KEY }}
        run: |
          python secure.py lock
          git config user.name "finder-bot"
          git config user.email "finder-bot@users.noreply.github.com"
          git add companies.json.enc state/*.enc docs/index.html docs/jobs.json docs/status.json
          git commit -m "Finder run $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing new"
          git pull --rebase -X ours || true
          git push

